services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yarli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yarli}
      POSTGRES_DB: ${POSTGRES_DB:-yarli_verify}
    volumes:
      - yarli_pgdata:/var/lib/postgresql/data

  api:
    image: ${API_IMAGE:-your-dockerhub-username/yarli-api}:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-yarli}:${POSTGRES_PASSWORD:-yarli}@postgres:5432/${POSTGRES_DB:-yarli_verify}
      API_DOC_PATH: ${API_DOC_PATH:-api/docs}
      API_DOC_VERSION: ${API_DOC_VERSION:-1.0.0}
      OPEN_API_VERSION: ${OPEN_API_VERSION:-3.0.0}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://0.0.0.0:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "3000:3000"

  web:
    image: ${WEB_IMAGE:-your-dockerhub-username/yarli-web}:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://0.0.0.0:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "80:3000"

  api-migrate:
    image: ${API_IMAGE:-your-dockerhub-username/yarli-api}:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-yarli}:${POSTGRES_PASSWORD:-yarli}@postgres:5432/${POSTGRES_DB:-yarli_verify}
    command: ["yarn", "workspace", "api", "db:migrate:deploy"]
    restart: "no"

  api-seed:
    image: ${API_IMAGE:-your-dockerhub-username/yarli-api}:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-yarli}:${POSTGRES_PASSWORD:-yarli}@postgres:5432/${POSTGRES_DB:-yarli_verify}
    command: ["yarn", "workspace", "api", "db:seed"]
    restart: "no"

volumes:
  yarli_pgdata:
