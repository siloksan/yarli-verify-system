name: Deploy on local machine

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yarli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yarli}
      POSTGRES_DB: ${POSTGRES_DB:-yarli_verify}
    ports:
      - "5432:5432"
    volumes:
      - yarli_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-yarli} -d ${POSTGRES_DB:-yarli_verify}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: yarli-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    pull_policy: never
    restart: always
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-yarli}:${POSTGRES_PASSWORD:-yarli}@postgres:5432/${POSTGRES_DB:-yarli_verify}
      API_DOC_PATH: ${API_DOC_PATH:-api/docs}
      API_DOC_VERSION: ${API_DOC_VERSION:-1.0.0}
      OPEN_API_VERSION: ${OPEN_API_VERSION:-3.0.0}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: yarli-web:local
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    pull_policy: never
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "80:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-migrate:
    image: yarli-api:local
    profiles: ["tools"]
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-yarli}:${POSTGRES_PASSWORD:-yarli}@postgres:5432/${POSTGRES_DB:-yarli_verify}
    command: ["yarn", "workspace", "api", "db:migrate:deploy"]
    restart: "no"

  api-seed:
    image: yarli-api:local
    profiles: ["tools"]
    depends_on:
      - postgres
      - api-migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-yarli}:${POSTGRES_PASSWORD:-yarli}@postgres:5432/${POSTGRES_DB:-yarli_verify}
    command: ["yarn", "workspace", "api", "db:seed"]
    restart: "no"

volumes:
  yarli_pgdata:
